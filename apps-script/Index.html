<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Révision</title>
    <style>
        :root {
            --navy: #1e3a8a;
            --blue: #3b82f6;
            --gold: #f5c542;
            --ink: #1f2937;
            --muted: #6b7280;
            --line: #e5e7eb;
            --bg: #f3f4f8;
            --green: #22c55e;
            --red: #ef4444;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: var(--ink);
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Bannière */
        .banner {
            background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%);
            color: #fff;
            padding: 22px 24px;
            text-align: center;
            border-bottom: 4px solid var(--gold);
        }
        .banner h1 {
            margin: 0;
            font-size: clamp(1.8rem, 5vw, 2.6rem);
            font-weight: 800;
            letter-spacing: .04em;
        }
        .banner h1 span { color: var(--gold); }
        .banner p { margin: 6px 0 0; opacity: .9; font-size: 1rem; }

        /* Mise en page */
        .layout { display: flex; flex: 1; min-height: 0; }
        .sidebar {
            width: 220px;
            flex-shrink: 0;
            background: #fff;
            border-right: 1px solid var(--line);
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .tab {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 12px 14px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            font: inherit;
            font-weight: 600;
            color: var(--muted);
            cursor: pointer;
            text-align: left;
        }
        .tab:hover { background: #eef2ff; color: var(--navy); }
        .tab[aria-selected="true"] { background: var(--navy); color: #fff; }
        .tab .count {
            margin-left: auto;
            font-size: .8rem;
            padding: 2px 8px;
            border-radius: 999px;
            background: rgba(0,0,0,.08);
        }
        .tab[aria-selected="true"] .count { background: rgba(255,255,255,.25); }

        .content { flex: 1; padding: 28px; min-width: 0; }
        .content h2 { margin: 0 0 18px; font-size: 1.5rem; }

        /* Liste de cartes */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }
        .card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 18px;
            text-align: left;
            font: inherit;
            cursor: pointer;
            transition: transform .15s, box-shadow .15s;
        }
        .card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(30,58,138,.15); }
        .card .emoji { font-size: 2rem; }
        .card h3 { margin: 8px 0 4px; font-size: 1.1rem; color: var(--ink); }
        .card .meta { font-size: .85rem; color: var(--muted); }
        .card .desc { margin: 8px 0 0; font-size: .9rem; color: var(--ink); }
        .empty {
            background: #fff;
            border: 2px dashed var(--line);
            border-radius: 14px;
            padding: 40px 20px;
            text-align: center;
            color: var(--muted);
        }

        /* Quiz */
        .panel {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,.08);
            padding: 28px;
            max-width: 720px;
            margin: 0 auto;
        }
        .back {
            border: 0; background: none; font: inherit; font-weight: 600;
            color: var(--blue); cursor: pointer; padding: 0; margin-bottom: 14px;
        }
        .progress { display: flex; justify-content: space-between; font-size: .9rem; font-weight: 600; color: var(--muted); margin-bottom: 18px; }
        .progress .score { color: var(--blue); }
        .question { font-size: 1.35rem; font-weight: 700; text-align: center; margin: 0 0 22px; line-height: 1.35; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .option {
            padding: 14px 16px;
            border: 2px solid var(--line);
            border-radius: 12px;
            background: #f9fafb;
            font: inherit; font-weight: 600; color: var(--ink);
            text-align: left; cursor: pointer;
            transition: transform .15s, border-color .15s, background .15s;
        }
        .option:hover:not(:disabled) { transform: translateY(-2px); border-color: #93c5fd; background: #eff6ff; }
        .option:disabled { cursor: default; }
        .option.correct { background: var(--green); border-color: #16a34a; color: #fff; }
        .option.incorrect { background: var(--red); border-color: #dc2626; color: #fff; }
        .option.dim { opacity: .5; }
        .explication {
            margin: 0 0 20px; padding: 14px 16px; border-radius: 10px;
            background: #e8f4f8; border-left: 4px solid var(--blue);
            font-size: .95rem; line-height: 1.4;
        }
        .btn {
            display: block; margin: 0 auto; border: 0; border-radius: 999px;
            padding: 12px 30px; background: var(--blue); color: #fff;
            font: inherit; font-weight: 700; cursor: pointer;
        }
        .btn:hover { background: #2563eb; }
        .result { text-align: center; }
        .result .big-emoji { font-size: 4rem; }
        .result .final { font-size: 3rem; font-weight: 800; color: var(--blue); margin: 6px 0 14px; }
        .result .msg { font-style: italic; margin-bottom: 22px; }
        .result .actions { display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .btn.secondary { background: #fff; color: var(--blue); border: 2px solid var(--blue); }
        .btn.secondary:hover { background: #eff6ff; }

        /* Questions à réponse écrite */
        .saisie {
            width: 100%; padding: 14px 16px; font: inherit; font-size: 1.15rem;
            border: 3px solid var(--line); border-radius: 14px; background: #fff;
        }
        .saisie:focus { outline: none; border-color: var(--blue); }
        .saisie.input-correct { border-color: var(--green); background: #f0fdf4; color: #166534; }
        .saisie.input-wrong { border-color: var(--red); background: #fef2f2; color: #991b1b; }
        .feedback { min-height: 28px; margin: 12px 0; font-weight: 700; }
        .feedback.ok { color: #16a34a; }
        .feedback.ko { color: #dc2626; }
        .saisie-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 18px; }
        .saisie-actions .btn { margin: 0; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        .shake { animation: shake .4s ease-in-out; }

        /* Flashcards */
        .flashcard {
            width: 100%; min-height: 240px; padding: 24px; cursor: pointer; font: inherit;
            border: 2px solid var(--line); border-radius: 18px; background: #fff;
            box-shadow: 0 4px 14px rgba(0,0,0,.08);
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px;
        }
        .flashcard.flipped { background: #eff6ff; border-color: var(--blue); }
        .face-label { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
        .face-text { font-size: 1.5rem; font-weight: 700; text-align: center; line-height: 1.35; color: var(--ink); }
        .deck-nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 16px; }
        .deck-nav .btn { margin: 0; }
        .btn:disabled { opacity: .5; cursor: default; }
        .hint-small { text-align: center; color: var(--muted); font-size: .85rem; margin: 12px 0 0; }

        /* Mobile : les onglets passent en barre horizontale */
        @media (max-width: 700px) {
            .layout { flex-direction: column; }
            .sidebar { width: 100%; flex-direction: row; border-right: 0; border-bottom: 1px solid var(--line); padding: 10px; }
            .tab { justify-content: center; }
            .content { padding: 16px; }
            .options { grid-template-columns: 1fr; }
            .panel { padding: 20px; }
        }
    </style>
</head>

                    { question: "Le quartier glacé et enneigé ?", reponses: ["tundratown"] },
                    { question: "Le centre-ville animé avec les gratte-ciels ?", reponses: ["downtown"] },
                    { question: "La forêt tropicale très humide ?", reponses: ["rainforest district"] },
                    { question: "Comment dit-on « des gratte-ciels » ?", reponses: ["skyscrapers", "skyscraper"] },
                    { question: "Comment dit-on « des dunes de sable » ?", reponses: ["sand dunes", "sand dune"] },
                    { question: "Comment dit-on « une cascade » ?", reponses: ["waterfall"] },
                    { question: "L'accentuation : quelle est LA syllabe accentuée dans GIRAFFE ? (Tape juste la syllabe)", reponses: ["raffe"] },
                    { question: "L'accentuation : quelle est LA syllabe accentuée dans ELEPHANT ? (Tape juste la syllabe)", reponses: ["el"] },
                    { question: "Traduis : « humide »", reponses: ["humid", "wet"] }
                ]
            }
        ];

        // Pas de flashcards intégrées : les paquets viennent de la page d'administration.
        const FLASHCARDS = [];

        // ================================================================
        // Application
        // ================================================================
        const content = document.getElementById("content");
        let activeTab = "quiz";
        let inQuiz = false; // vrai pendant qu'un quiz ou un paquet est ouvert (évite de le remplacer par la liste)

        // Petit utilitaire pour créer des éléments sans innerHTML
        function h(tag, props, ...children) {
            const el = document.createElement(tag);
            Object.entries(props || {}).forEach(([k, v]) => {
                if (k === "class") el.className = v;
                else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
                else el.setAttribute(k, v);
            });
            children.flat().forEach(c => { if (c != null) el.append(c); });
            return el;
        }

        // Mélange de Fisher-Yates sur une copie
        function shuffle(list) {
            const a = list.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // Compare sans tenir compte de la casse, des accents, de la ponctuation et des espaces en trop
        function norm(text) {
            return text.toLowerCase()
                .normalize("NFD").replace(/[̀-ͯ]/g, "")
                .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "")
                .trim()
                .replace(/\s{2,}/g, " ");
        }

        function updateCounts() {
            document.getElementById("count-quiz").textContent = QUIZZES.length;
            document.getElementById("count-flashcards").textContent = FLASHCARDS.length;
        }

        function setTab(tab) {
            activeTab = tab;
            document.querySelectorAll(".tab").forEach(b =>
                b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
            renderList();
        }

        function renderList() {
            inQuiz = false;
            content.replaceChildren();
            if (activeTab === "quiz") {
                content.append(h("h2", {}, "Quiz"));
                if (QUIZZES.length === 0) {
                    content.append(h("div", { class: "empty" }, "Aucun quiz pour le moment."));
                    return;
                }
                content.append(h("div", { class: "grid" }, QUIZZES.map(q =>
                    h("button", { class: "card", onclick: () => startQuiz(q) },
                        h("div", { class: "emoji" }, q.emoji),
                        h("h3", {}, q.titre),
                        h("div", { class: "meta" }, `${q.matiere} · ${q.questions.length} questions`),
                        h("p", { class: "desc" }, q.description)
                    )
                )));
            } else {
                content.append(h("h2", {}, "Flashcards"));
                if (FLASHCARDS.length === 0) {
                    content.append(h("div", { class: "empty" }, "Aucune flashcard pour le moment. Elles apparaîtront ici."));
                    return;
                }
                content.append(h("div", { class: "grid" }, FLASHCARDS.map(d =>
                    h("button", { class: "card", onclick: () => startDeck(d) },
                        h("div", { class: "emoji" }, d.emoji),
                        h("h3", {}, d.titre),
                        h("div", { class: "meta" }, `${d.matiere} · ${d.cartes.length} cartes`),
                        h("p", { class: "desc" }, d.description)
                    )
                )));
            }
        }

        // ---------------- Quiz ----------------
        function startQuiz(quiz) {
            inQuiz = true;
            let index = 0;
            let score = 0;
            const total = quiz.questions.length;

            const back = () => h("button", { class: "back", onclick: renderList }, "← Retour à la liste");

            function showQuestion() {
                const q = quiz.questions[index];
                const scoreEl = h("span", { class: "score" }, `Score : ${score}`);
                const explication = q.explication
                    ? h("div", { class: "explication", style: "display:none" }, q.explication)
                    : null;
                const next = h("button", { class: "btn", style: "display:none", onclick: () => {
                    index++;
                    index < total ? showQuestion() : showResult();
                } }, index + 1 < total ? "Question suivante ➔" : "Voir le résultat ➔");
                // Appelé quand la question est terminée : montre l'explication et le bouton suivant
                const reveal = () => {
                    if (explication) explication.style.display = "block";
                    next.style.display = "block";
                    next.focus();
                };
                const addPoint = () => { score++; scoreEl.textContent = `Score : ${score}`; };
                const body = Array.isArray(q.reponses)
                    ? typedBody(q, addPoint, reveal)
                    : choiceBody(q, addPoint, reveal);

                content.replaceChildren(h("div", { class: "panel" },
                    back(),
                    h("div", { class: "progress" },
                        h("span", {}, `Question ${index + 1} / ${total}`), scoreEl),
                    h("h3", { class: "question" }, q.question),
                    body,
                    explication,
                    next
                ));
            }

            // Question à choix : l'ordre des réponses est mélangé à chaque affichage
            function choiceBody(q, addPoint, reveal) {
                let answered = false;
                const order = shuffle(q.options.map((text, i) => ({ text, ok: i === q.correct })));
                const buttons = order.map((o, i) =>
                    h("button", { class: "option", onclick: () => {
                        if (answered) return;
                        answered = true;
                        const good = buttons[order.findIndex(x => x.ok)];
                        if (o.ok) {
                            addPoint();
                            buttons[i].classList.add("correct");
                        } else {
                            buttons[i].classList.add("incorrect");
                            good.classList.add("correct");
                        }
                        buttons.forEach(b => {
                            b.disabled = true;
                            if (b !== buttons[i] && b !== good) b.classList.add("dim");
                        });
                        reveal();
                    } }, o.text));
                return h("div", { class: "options" }, buttons);
            }

            // Question à réponse écrite : on réessaie jusqu'à trouver ; le point n'est donné qu'au premier essai.
            // Après 3 erreurs, un bouton permet de voir la réponse (sans point).
            function typedBody(q, addPoint, reveal) {
                let tries = 0;
                let done = false;
                const input = h("input", { type: "text", class: "saisie", placeholder: "Écris ta réponse…",
                    autocomplete: "off", autocapitalize: "off", spellcheck: "false", "aria-label": "Ta réponse" });
                const feedback = h("div", { class: "feedback", role: "status" });
                const check = h("button", { class: "btn", onclick: validate }, "Valider ✔️");
                const showAnswer = h("button", { class: "btn secondary", style: "display:none", onclick: giveUp }, "Voir la réponse");

                function finish(ok, text) {
                    done = true;
                    input.disabled = true;
                    check.style.display = "none";
                    showAnswer.style.display = "none";
                    feedback.className = "feedback " + (ok ? "ok" : "ko");
                    feedback.textContent = text;
                    reveal();
                }
                function validate() {
                    if (done) return;
                    const value = norm(input.value);
                    if (!value) return;
                    if (q.reponses.some(r => norm(r) === value)) {
                        input.classList.remove("input-wrong", "shake");
                        input.classList.add("input-correct");
                        if (tries === 0) addPoint();
                        finish(true, tries === 0
                            ? "🎉 Bravo ! Bonne réponse !"
                            : "✅ Bonne réponse, mais sans point : il t'a fallu plusieurs essais.");
                    } else {
                        tries++;
                        input.classList.remove("shake");
                        void input.offsetWidth; // relance l'animation
                        input.classList.add("input-wrong", "shake");
                        feedback.className = "feedback ko";
                        feedback.textContent = "❌ Oups, essaie encore !";
                        if (tries >= 3) showAnswer.style.display = "inline-block";
                        input.select();
                    }
                }
                function giveUp() {
                    input.classList.add("input-wrong");
                    finish(false, "La réponse était : " + q.reponses[0]);
                }
                input.addEventListener("keydown", e => {
                    if (e.key === "Enter") { e.preventDefault(); validate(); }
                });
                setTimeout(() => input.focus(), 0);
                return h("div", {}, input, feedback, h("div", { class: "saisie-actions" }, check, showAnswer));
            }

            function showResult() {
                let emoji, msg;
                if (score === total) {
                    emoji = "👑"; msg = "Impérial ! Tu connais ce cours sur le bout des doigts !";
                } else if (score >= total * 0.7) {
                    emoji = "🛡️"; msg = "Très bon travail ! Tes révisions portent leurs fruits.";
                } else if (score >= total * 0.5) {
                    emoji = "📜"; msg = "C'est un bon début, une petite relecture du cours te permettrait d'être parfait.";
                } else {
                    emoji = "💪"; msg = "Ne te décourage pas ! Relis tes fiches et relance le quiz, tu vas y arriver !";
                }
                content.replaceChildren(h("div", { class: "panel result" },
                    h("h2", {}, "Quiz terminé !"),
                    h("div", { class: "big-emoji" }, emoji),
                    h("p", {}, "Ton score final est de :"),
                    h("div", { class: "final" }, `${score} / ${total}`),
                    h("p", { class: "msg" }, msg),
                    h("div", { class: "actions" },
                        h("button", { class: "btn", onclick: () => startQuiz(quiz) }, "Rejouer 🔄"),
                        h("button", { class: "btn secondary", onclick: renderList }, "Retour à la liste")
                    )
                ));
            }

            showQuestion();
        }

        // ---------------- Flashcards ----------------
        function startDeck(deck) {
            inQuiz = true;
            let cards = deck.cartes.slice();
            let index = 0;
            let flipped = false;

            const card = h("button", { class: "flashcard", "aria-label": "Retourner la carte", onclick: () => { flipped = !flipped; draw(); } });
            const counter = h("span", {});
            const prev = h("button", { class: "btn secondary", onclick: () => go(-1) }, "← Précédente");
            const next = h("button", { class: "btn", onclick: () => go(1) }, "Suivante →");
            const mix = h("button", { class: "btn secondary", onclick: () => { cards = shuffle(cards); index = 0; flipped = false; draw(); } }, "🔀 Mélanger");

            function go(delta) { index += delta; flipped = false; draw(); }

            function draw() {
                const c = cards[index];
                card.classList.toggle("flipped", flipped);
                card.replaceChildren(
                    h("div", { class: "face-label" }, flipped ? "Réponse" : "Question"),
                    h("div", { class: "face-text" }, flipped ? c.verso : c.recto));
                counter.textContent = `Carte ${index + 1} / ${cards.length}`;
                prev.disabled = index === 0;
                next.disabled = index === cards.length - 1;
            }

            content.replaceChildren(h("div", { class: "panel" },
                h("button", { class: "back", onclick: renderList }, "← Retour à la liste"),
                h("div", { class: "progress" }, h("span", {}, deck.titre), counter),
                card,
                h("div", { class: "deck-nav" }, prev, mix, next),
                h("p", { class: "hint-small" }, "Clique sur la carte pour la retourner.")
            ));
            draw();
        }

        // Compteurs dans les onglets + événements
        updateCounts();
        document.querySelectorAll(".tab").forEach(b =>
            b.addEventListener("click", () => setTab(b.dataset.tab)));

        setTab("quiz");

        // Quiz et paquets ajoutés depuis la page d'administration (uniquement une fois déployé dans Apps Script).
        // Ce qui est écrit ci-dessus reste affiché si le serveur ne répond pas.
        if (window.google && google.script && google.script.run) {
            const merge = (target, saved) => saved.forEach(item => {
                const i = target.findIndex(x => x.id === item.id);
                if (i >= 0) target[i] = item; else target.push(item);
            });
            const refresh = () => { updateCounts(); if (!inQuiz) renderList(); };
            google.script.run.withSuccessHandler(saved => { merge(QUIZZES, saved); refresh(); }).getQuizzes();
            google.script.run.withSuccessHandler(saved => { merge(FLASHCARDS, saved); refresh(); }).getDecks();
        }
    </script>
</body>
</html>
