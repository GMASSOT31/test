# QUIZy sur Cloudflare Workers (offre gratuite). Construction : node build.cjs (pages et serveur générés depuis ../apps-script).
name = "quizy"
main = "src/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[build]
command = "node build.cjs"
watch_dir = ["../apps-script", "static"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]

[observability]
enabled = true
