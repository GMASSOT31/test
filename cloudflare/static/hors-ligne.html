<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QUIZy · hors ligne</title>
<meta name="theme-color" content="#414E98">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
         background: #102B52; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  main { max-width: 380px; }
  img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  h1 { font-size: 1.4rem; margin: 18px 0 8px; }
  p { color: #C8CEE8; line-height: 1.4; margin: 0 0 22px; }
  button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 14px; background: #F5B400; color: #102B52;
           font: inherit; font-weight: 800; font-size: 1rem; cursor: pointer; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="">
  <h1>Pas de connexion internet</h1>
  <p>QUIZy a besoin d'internet pour enregistrer tes révisions. Vérifie le Wi-Fi ou les données mobiles, puis réessaie.</p>
  <button type="button" onclick="location.reload()">🔄 Réessayer</button>
</main>
</body>
</html>
